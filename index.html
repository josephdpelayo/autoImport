<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AutoImport Tepic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background: #F5F5F7;
    }
    .login-wrap { width: 100%; max-width: 360px; }
    .login-logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo-icon {
      width: 64px; height: 64px;
      background: #1a1a1a;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
    }
    .logo-icon i { font-size: 32px; color: #fff; }
    .logo-title  { font-size: 22px; font-weight: 500; color: #1a1a1a; }
    .logo-sub    { font-size: 13px; color: #aaa; margin-top: 4px; }

    .login-form { display: flex; flex-direction: column; gap: 12px; }
    .login-form input {
      width: 100%;
      padding: 14px 16px;
      border: 0.5px solid #e8e8e8;
      border-radius: 14px;
      font-size: 15px;
      background: #fff;
      color: #1a1a1a;
      outline: none;
      font-family: var(--font);
      transition: border-color 0.15s;
    }
    .login-form input:focus { border-color: #1a1a1a; }
    .login-btn {
      width: 100%;
      padding: 15px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font);
      transition: opacity 0.15s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .login-btn:active { opacity: 0.8; }
    .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-msg {
      background: #FCEBEB;
      color: #A32D2D;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      display: none;
    }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
  <div class="login-wrap fade-in">
    <div class="login-logo">
      <div class="logo-icon"><i class="ti ti-car"></i></div>
      <div class="logo-title">AutoImport Tepic</div>
      <div class="logo-sub">Control de autos importados</div>
    </div>

    <div class="login-form">
      <input type="email" id="email" placeholder="Correo electrónico" autocomplete="email">
      <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password">
      <div class="error-msg" id="error-msg"></div>
      <button class="login-btn" id="login-btn" onclick="login()">
        <i class="ti ti-login"></i>Entrar
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { supabase, getSession } from './js/supabase.js';

    // Si ya hay sesión, redirigir al dashboard
    getSession().then(session => {
      if (session) window.location.href = '/pages/dashboard.html';
    });

    window.login = async function() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('login-btn');
      const errEl    = document.getElementById('error-msg');

      if (!email || !password) {
        errEl.textContent = 'Ingresa tu correo y contraseña';
        errEl.classList.add('show');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>Entrando...';
      errEl.classList.remove('show');

      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = '/pages/dashboard.html';
      } catch (err) {
        errEl.textContent = 'Correo o contraseña incorrectos';
        errEl.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-login"></i>Entrar';
      }
    };

    // Enter para hacer login
    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') window.login();
    });
  </script>
</body>
</html>
